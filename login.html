<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar sesión - Sport IQ</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="cuenta.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="login-body">
  <main class="login-box">
    <img src="imagenes/Sports.png" alt="Sport IQ Logo" class="login-logo">
    <h1>Inicia sesión</h1>
    <p class="login-sub">Accede a tu cuenta para ver tus análisis y tu plan de IA.</p>

    <form id="login-form" novalidate>
      <label class="field">
        <span>Correo electrónico</span>
        <input type="email" id="email" placeholder="tu@correo.com" autocomplete="email">
      </label>
      <label class="field">
        <span>Contraseña</span>
        <input type="password" id="password" placeholder="Mínimo 6 caracteres" autocomplete="current-password">
      </label>
      <p class="form-error" id="login-error" role="alert"></p>
      <button type="submit" class="action-btn login-btn">Entrar</button>
    </form>

    <p class="login-foot">¿No tienes cuenta? <a href="#">Regístrate</a></p>
  </main>
  <script src="cuenta.js"></script>
</body>
</html>
